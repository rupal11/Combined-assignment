<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .tasks{
            display:flex;
            gap:8px
        }

        #to-do, #in-progress, #under-review, #completed{
            border: 1px solid black;
            padding:10px;
        }

        .task{
            background-color:#d4d4d4;
            padding: 5px;
            margin:5px;
        }

        .task h4,p{
            margin:0;
        }



    </style>
</head>
<body>

    <!-- https://runebook.dev/en/docs/html/reference/global_attributes/draggable -->
<h1>To Do</h1>

    <div class="tasks">

        
        
        <div class="column" id="to-do">
            <h1>To do</h1>
            <div class="task" id="task-1" draggable="true">
                <h4>to do heading 1</h4>
                <p>to dohh des</p>
            </div>

        </div>

        <div class="column" id="in-progress">
             <h1>In progress</h1>
            <div class="task" id="task-2" draggable="true" >
                <h4>to do heading 2</h4>
                <p>to dohh des</p>
            </div>

        </div>

        <div class="column" id="under-review">
             <h1>Under review</h1>
            <div class="task" id="task-3" draggable="true">
                <h4>to do heading 3</h4>
                <p>to dohh des</p>
            </div>
        </div>

        <div class="column" id="completed">
             <h1>Completed</h1>
            <div class="task" id="task-4" draggable="true">
                <h4>to do heading 4</h4>
                <p>to dohh des</p>
            </div>

        </div>




    </div>
    
<script>



const tasks = document.querySelectorAll('.task');
const columns = document.querySelectorAll('.column');


//applying dragstart eventlistener on each item
tasks.forEach(task=>{

    task.addEventListener('dragstart',(e)=>{
    e.dataTransfer.setData('div',e.target.id);
    console.log(task);
    console.log(e.dataTransfer );
        })
})

columns.forEach(col=>{
    col.addEventListener('dragover',(e)=>{
        e.preventDefault();
                
    })


})

//making the colunms droppable
columns.forEach(col=>{
    col.addEventListener('drop',(e)=>{
        e.preventDefault();
        // const data = e.dataTransfer.getData('div');

        const id = e.dataTransfer.getData('div');
        const draggedElement = document.getElementById(id);

        // Move the element into this specific container
        col.appendChild(draggedElement);
        
    })


})



</script>    


</body>
</html>
